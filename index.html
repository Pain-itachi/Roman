<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marquee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
:root{--bg:#0b0d17;--panel:#141828;--panel2:#1b2036;--line:#262c47;--text:#eceeff;--dim:#8a90b5;--accent:#b7a6ff;--live:#ff5d73;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.dock{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit}
button:focus-visible,input:focus{outline:2px solid var(--accent);outline-offset:2px}
header{padding:16px 14px 6px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:12px}
h1 i{font-style:normal;color:var(--accent)}
input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:12px 18px;font:inherit;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--dim);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#14102b}
.count{padding:0 14px 8px;font-size:12px;color:var(--dim)}
.grid{display:grid;gap:14px 10px;padding:0 14px 20px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tile{position:relative;text-align:center;cursor:pointer;min-width:0}
.logo{aspect-ratio:1;width:100%;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;border:2px solid transparent}
.tile.play .logo{border-color:var(--accent)}
.logo img{width:78%;height:78%;object-fit:contain}
.logo .l{display:none;font-size:30px;font-weight:800;color:#9aa0c2}
.logo.nologo .l{display:block}
.tn{font-size:12px;font-weight:600;margin-top:7px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heart{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(11,13,23,.65);color:#fff;font-size:15px;cursor:pointer}
.heart.on{color:#ff6b8a}
.more{display:block;margin:0 auto 24px;padding:11px 24px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.empty{grid-column:1/-1;padding:40px 10px;text-align:center;color:var(--dim)}
/* player: full screen or docked mini bar */
#pl{position:fixed;z-index:10;display:none;background:#000}
#pl.full{display:flex;inset:0;flex-direction:column}
#pl.mini{display:flex;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:68px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;align-items:center;gap:10px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#top,#ctl{display:none;align-items:center;gap:6px;padding:8px 10px;background:#000}
#pl.full #top,#pl.full #ctl{display:flex}
#top{padding-top:calc(8px + env(safe-area-inset-top,0px))}
#ctl{justify-content:space-around;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#tn{flex:1;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:none;border:0;color:var(--text);font-size:22px;padding:8px 12px;cursor:pointer}
.ib.on{color:#ff6b8a}
#vw{position:relative;background:#000;overflow:hidden}
#pl.full #vw{flex:1;min-height:0}
#pl.mini #vw{width:96px;height:54px;border-radius:12px;flex:none}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#msg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:13px;font-weight:600;background:rgba(11,13,23,.85);border-radius:12px;padding:9px 12px;display:none}
#pl.mini #msg{display:none!important}
#mi{display:none;flex:1;min-width:0;cursor:pointer}
#pl.mini #mi{display:block}
#mi b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mi small{color:var(--live);font-size:11px;font-weight:800;letter-spacing:.5px}
#mb{display:none}
#pl.mini #mb{display:flex}
</style>
</head>
<body>
<header>
  <h1>Mar<i>quee</i></h1>
  <input id="q" type="search" placeholder="Search channels" autocomplete="off">
</header>
<div class="chips" id="chips"></div>
<div class="count" id="count">Loading channels…</div>
<div class="grid" id="grid"></div>
<button class="more" id="more" hidden>Show more</button>

<div id="pl">
  <div id="top"><button class="ib" data-act="min" aria-label="Minimize">⌄</button><span id="tn"></span><button class="ib" data-act="fav" aria-label="Favorite">♥</button></div>
  <div id="vw"><video id="v" playsinline autoplay></video><div id="msg"></div></div>
  <div id="mi" data-act="expand"><b id="mn"></b><small>● LIVE</small></div>
  <div id="mb"><button class="ib" data-act="pause" aria-label="Play or pause">⏸</button><button class="ib" data-act="close" aria-label="Close">✕</button></div>
  <div id="ctl"><button class="ib" data-act="prev" aria-label="Previous channel">⏮</button><button class="ib" data-act="pause" aria-label="Play or pause">⏸</button><button class="ib" data-act="next" aria-label="Next channel">⏭</button><button class="ib" data-act="mute" aria-label="Sound">🔊</button><button class="ib" data-act="fs" aria-label="Fullscreen">⛶</button><button class="ib" data-act="close" aria-label="Close">✕</button></div>
</div>

<script>
const PLAYLIST = "https://romaxa55.github.io/world_ip_tv/output/index.m3u";
const tg = window.Telegram && window.Telegram.WebApp;
try { tg && (tg.ready(), tg.expand()); } catch (e) {}
const store = {
  get(k) { return new Promise(res => {
    try { if (tg && tg.CloudStorage && tg.isVersionAtLeast("6.9")) return tg.CloudStorage.getItem(k, (e, v) => res(e ? null : v)); } catch (e) {}
    try { res(localStorage.getItem(k)); } catch (e) { res(null); } }); },
  set(k, v) {
    try { if (tg && tg.CloudStorage && tg.isVersionAtLeast("6.9")) return tg.CloudStorage.setItem(k, v); } catch (e) {}
    try { localStorage.setItem(k, v); } catch (e) {}
  }
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const RX = {
  cinema: /movie|cine|film|kino|cinema|hbo|cinemax|starz|showtime|western|thriller|horror|mgm|filmbox/i,
  sports: /sport|espn|football|soccer|nba|nfl|ufc|wwe|golf|tennis|racing|motogp|fight|eurosport|dazn|bein/i,
  news: /news|noticias|cnn|euronews|jazeera|bloomberg|cnbc|france 24|\bdw\b|nachrichten/i,
  kids: /kid|junior|cartoon|nick|disney|boomerang|toon|baby|gulli|clan/i,
  music: /music|mtv|hits|vh1|trace|vevo|radio/i,
  docs: /document|discovery|history|nat geo|national geographic|science|planet|nature|crime/i,
  anime: /anime|animax|crunchyroll|manga|otaku|toonami|naruto|pokemon|dragon ?ball|gundam|doraemon|one piece/i
};
const CATS = [["cinema","🎬 Cinema"],["sports","⚽ Sports"],["news","📰 News"],["kids","🧸 Kids"],["music","🎵 Music"],["docs","🌍 Docs"],["anime","🎌 Anime"]];

let channels = [], streams = {}, favs = new Set(), dead = new Set();
let state = {q: "", cat: "all", shown: 90, playing: null};
let hls = null, urls = [], idx = 0, wd = null, deadline = 0, welcomeMode = false, welcomeQ = [], msgT = null;

function parseM3U(text) {
  const map = new Map(), up = {};
  let cur = null, skip = false;
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.trim();
    if (!l) continue;
    if (l.startsWith("#EXTINF")) {
      const a = k => { const m = l.match(new RegExp(k + '="([^"]*)"')); return m ? m[1] : ""; };
      cur = {tvg: a("tvg-id"), logo: a("tvg-logo"), group: a("group-title"), name: l.slice(l.lastIndexOf(",") + 1).trim()};
      skip = false;
    } else if (l.startsWith("#EXTVLCOPT") || l.startsWith("#EXTHTTP")) {
      skip = true; // needs special headers, can't play in a browser
    } else if (l[0] !== "#" && cur) {
      const key = cur.tvg || cur.name, blob = cur.group + " " + cur.name;
      if (!map.has(key) && !/xxx|adult|porn|18\+/i.test(blob)) {
        map.set(key, {id: key, name: cur.name || key, logo: cur.logo, group: cur.group, cats: Object.keys(RX).filter(k => RX[k].test(blob))});
        streams[key] = []; up[key] = [];
      }
      if (map.has(key) && !skip) {
        if (l.startsWith("https://")) streams[key].push(l);
        else if (l.startsWith("http://")) up[key].push("https://" + l.slice(7)); // try the secure version
      }
      cur = null;
    }
  }
  const out = [];
  for (const c of map.values()) { streams[c.id] = streams[c.id].concat(up[c.id]); if (streams[c.id].length) out.push(c); }
  return out;
}

async function getPlaylist() {
  let c = null; try { c = await caches.open("marquee-v1"); } catch (e) {}
  let at = 0; try { at = +localStorage.getItem("marquee-at") || 0; } catch (e) {}
  if (c && Date.now() - at < 3 * 3600e3) { try { const r = await c.match(PLAYLIST); if (r) return await r.text(); } catch (e) {} }
  try {
    const resp = await fetch(PLAYLIST); if (!resp.ok) throw new Error(resp.status);
    const txt = await resp.text();
    if (c) { try { await c.put(PLAYLIST, new Response(txt)); localStorage.setItem("marquee-at", String(Date.now())); } catch (e) {} }
    return txt;
  } catch (e) {
    if (c) { try { const r = await c.match(PLAYLIST); if (r) return await r.text(); } catch (e2) {} }
    throw e;
  }
}

async function init() {
  try {
    const [txt, fv] = await Promise.all([getPlaylist(), store.get("marquee-favs")]);
    try { favs = new Set(JSON.parse(fv || "[]")); } catch (e) {}
    try { const d = JSON.parse(localStorage.getItem("marquee-dead") || "{}"); for (const k in d) if (Date.now() - d[k] < 43200000) dead.add(k); } catch (e) {}
    channels = parseM3U(txt).sort((a, b) => a.name.localeCompare(b.name));
    buildChips(); render(); welcome();
  } catch (e) { $("count").textContent = "Couldn't load channels. Check your connection and reopen the app."; }
}

function buildChips() {
  const tally = {}, groups = {};
  channels.forEach(c => { c.cats.forEach(k => tally[k] = (tally[k] || 0) + 1); if (c.group && !/^undefined$/i.test(c.group)) groups[c.group] = (groups[c.group] || 0) + 1; });
  const g = Object.keys(groups).filter(k => groups[k] >= 5 && k.length <= 22).sort((a, b) => groups[b] - groups[a]).slice(0, 8);
  $("chips").innerHTML = `<button class="chip on" data-c="all">All ${channels.length}</button><button class="chip" data-c="__fav">♥ Favorites</button>` +
    CATS.filter(([k]) => tally[k]).map(([k, l]) => `<button class="chip" data-c="k:${k}">${l} ${tally[k]}</button>`).join("") +
    g.map(n => `<button class="chip" data-c="g:${esc(n)}">${esc(n)} ${groups[n]}</button>`).join("");
}

function filtered() {
  const q = state.q.trim().toLowerCase(), c0 = state.cat;
  return channels.filter(c => !dead.has(c.id) && (!q || c.name.toLowerCase().includes(q)) && (
    c0 === "all" || (c0 === "__fav" ? favs.has(c.id) : c0.startsWith("k:") ? c.cats.includes(c0.slice(2)) : c.group === c0.slice(2))));
}

function render() {
  const list = filtered();
  $("count").textContent = list.length + " channel" + (list.length === 1 ? "" : "s");
  $("grid").innerHTML = list.slice(0, state.shown).map(c => {
    const ini = esc((c.name.charAt(0) || "?").toUpperCase());
    return `<div class="tile${state.playing === c.id ? " play" : ""}" data-id="${esc(c.id)}" role="button" tabindex="0"><div class="logo">${c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('nologo');this.remove()">` : ""}<b class="l">${ini}</b></div><div class="tn">${esc(c.name)}</div><button class="heart${favs.has(c.id) ? " on" : ""}" data-fav="${esc(c.id)}" aria-label="Favorite">♥</button></div>`;
  }).join("") || `<div class="empty">${state.cat === "__fav" ? "No favorites yet. Tap ♥ on a channel to save it." : "No channels match your search."}</div>`;
  $("grid").querySelectorAll(".logo").forEach(el => { if (!el.querySelector("img")) el.classList.add("nologo"); });
  $("more").hidden = list.length <= state.shown;
}

function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store.set("marquee-favs", JSON.stringify([...favs]));
  syncFav(); render();
}
function syncFav() { document.querySelectorAll('[data-act="fav"]').forEach(b => b.classList.toggle("on", favs.has(state.playing))); }
function showMsg(t, ms) {
  clearTimeout(msgT); $("msg").style.display = t ? "block" : "none"; $("msg").textContent = t || "";
  if (t && ms) msgT = setTimeout(() => showMsg(""), ms);
}

function setMode(m) {
  $("pl").className = m; document.body.classList.toggle("dock", m === "mini");
  try { if (tg) m === "full" ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

function play(id, opts) {
  const ch = channels.find(c => c.id === id); if (!ch) return;
  state.playing = id; urls = streams[id].slice(); idx = 0;
  welcomeMode = !!(opts && opts.welcome); $("v").muted = welcomeMode;
  $("tn").textContent = $("mn").textContent = ch.name;
  deadline = Date.now() + (welcomeMode ? 8000 : 30000);
  syncFav(); setMode("full"); start(); render();
}

function stop() {
  clearTimeout(wd);
  if (hls) { hls.destroy(); hls = null; }
  const v = $("v"); v.onerror = null; v.pause(); v.removeAttribute("src"); v.load();
}

function next() {
  if (idx + 1 < urls.length && deadline - Date.now() > 1000) { idx++; start(); return; }
  stop();
  dead.add(state.playing);
  try { const d = JSON.parse(localStorage.getItem("marquee-dead") || "{}"); d[state.playing] = Date.now(); localStorage.setItem("marquee-dead", JSON.stringify(d)); } catch (e) {}
  if (welcomeMode) { render(); return nextWelcome(); }
  showMsg("This channel isn't available right now. Please try another channel.");
  render();
}

function start() {
  stop(); showMsg("Connecting…");
  const v = $("v"), url = urls[idx];
  v.onplaying = () => {
    clearTimeout(wd);
    if (welcomeMode) { try { localStorage.setItem("marquee-ok", state.playing); } catch (e) {} showMsg("🎬 Now showing. Tap 🔇 for sound, or ⌄ to browse.", 5000); }
    else showMsg("");
  };
  wd = setTimeout(next, Math.min(Math.max(8000, 30000 / urls.length), Math.max(deadline - Date.now(), 0)));
  const mp = v.canPlayType("application/vnd.apple.mpegurl");
  const native = () => {
    if (hls) { hls.destroy(); hls = null; }
    v.onerror = next; v.src = url; v.play().catch(() => showMsg("Tap ▶ to start playing."));
  };
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({enableWorker: true, lowLatencyMode: true});
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { if (mp) native(); else next(); } });
    hls.loadSource(url); hls.attachMedia(v);
    v.play().catch(() => showMsg("Tap ▶ to start playing."));
  } else if (mp) { v.onerror = next; v.src = url; v.play().catch(() => {}); }
  else showMsg("This device can't play live streams.");
}

// Opens on a cinema channel (muted), trying up to 4 and remembering the one that worked
function welcome() {
  const pool = channels.filter(c => c.cats.includes("cinema") && !dead.has(c.id));
  if (!pool.length) return;
  let good = ""; try { good = localStorage.getItem("marquee-ok") || ""; } catch (e) {}
  const mix = a => a.sort(() => Math.random() - 0.5);
  welcomeQ = pool.filter(c => c.id === good).concat(mix(pool.filter(c => c.id !== good))).slice(0, 4).map(c => c.id);
  nextWelcome();
}
function nextWelcome() {
  const id = welcomeQ.shift();
  if (id) return play(id, {welcome: true});
  welcomeMode = false; stop(); state.playing = null; $("pl").className = ""; document.body.classList.remove("dock"); try { tg && tg.BackButton.hide(); } catch (e) {} render();
}

function zap(d) {
  const list = filtered(); if (!list.length) return;
  let i = list.findIndex(c => c.id === state.playing);
  i = i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length;
  try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {}
  play(list[i].id);
}
async function goFull() {
  const v = $("v");
  try {
    if (v.requestFullscreen) { await v.requestFullscreen(); try { await screen.orientation.lock("landscape"); } catch (e) {} }
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  } catch (e) {}
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) { try { screen.orientation.unlock(); } catch (e) {} } });

$("pl").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) { if ($("pl").className === "mini") setMode("full"); return; }
  const a = b.dataset.act, v = $("v");
  if (a === "min") setMode("mini");
  else if (a === "expand") setMode("full");
  else if (a === "fav") state.playing && toggleFav(state.playing);
  else if (a === "prev") zap(-1);
  else if (a === "next") zap(1);
  else if (a === "mute") v.muted = !v.muted;
  else if (a === "fs") goFull();
  else if (a === "pause") { if (v.paused) { urls.length && state.playing ? (v.src || hls ? v.play() : start()) : 0; } else v.pause(); }
  else if (a === "close") { welcomeMode = false; welcomeQ = []; stop(); state.playing = null; showMsg(""); $("pl").className = ""; document.body.classList.remove("dock"); try { tg && tg.BackButton.hide(); } catch (er) {} render(); }
});
$("v").addEventListener("volumechange", () => document.querySelectorAll('[data-act="mute"]').forEach(b => b.textContent = $("v").muted ? "🔇" : "🔊"));
["play", "pause"].forEach(ev => $("v").addEventListener(ev, () => document.querySelectorAll('[data-act="pause"]').forEach(b => b.textContent = $("v").paused ? "▶" : "⏸")));
try { tg && tg.BackButton.onClick(() => setMode("mini")); } catch (e) {}

$("q").addEventListener("input", e => { state.q = e.target.value; state.shown = 90; render(); });
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  state.cat = b.dataset.c; state.shown = 90; render();
});
$("grid").addEventListener("click", e => {
  const f = e.target.closest("[data-fav]"); if (f) { e.stopPropagation(); return toggleFav(f.dataset.fav); }
  const t = e.target.closest(".tile"); if (t) play(t.dataset.id);
});
$("grid").addEventListener("keydown", e => { if (e.key === "Enter") { const t = e.target.closest(".tile"); if (t) play(t.dataset.id); } });
$("more").addEventListener("click", () => { state.shown += 90; render(); });

init();
</script>
</body>
</html>
